name: mobile
description: "Qimmah app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  pinput: ^5.0.0
  url_launcher: ^6.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  cached_network_image: ^3.4.1
  image_picker: ^1.2.4
  share_plus: ^12.0.2
  photo_view: ^0.15.0


dev_dependencies:
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
   android: true
   ios: true
   image_path: "assets/images/app_icon.png"
   remove_alpha_ios: true
   web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1F5233"

flutter_native_splash:
  color: "#F6F5F1"                 # backgroundLight
  image: assets/images/logo_mountains.png
  color_dark: "#111714"            # backgroundDark
  image_dark: assets/images/logo_mountains.png

  android_12:
    color: "#F6F5F1"
    image: assets/images/app_icon.png
    icon_background_color: "#F6F5F1"
    color_dark: "#111714"
    image_dark: assets/images/app_icon.png
    icon_background_color_dark: "#111714"

  fullscreen: true
  web: false